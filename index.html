<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <title>Cassandra · Launcher</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #080e19; color: #e8edf5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #172943 0%, #080e19 62%); }
      main { width: min(760px, 100%); }
      .eyebrow { color: #8da6c5; font-size: 11px; letter-spacing: .2em; font-weight: 700; }
      h1 { margin: 10px 0 8px; font-size: clamp(38px, 8vw, 64px); letter-spacing: .12em; }
      .subtitle { color: #9baabd; margin: 0 0 34px; }
      .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      a { min-height: 190px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #34445b; border-radius: 12px; color: inherit; text-decoration: none; background: #111d2d; transition: border-color .15s, transform .15s, background .15s; }
      a:hover, a:focus-visible { border-color: #7ea6d8; background: #17283d; transform: translateY(-2px); outline: none; }
      .symbol { font-size: 28px; color: #91b9eb; }
      strong { display: block; font-size: 21px; letter-spacing: .08em; }
      small { display: block; margin-top: 8px; color: #aab8ca; line-height: 1.5; }
      .open { margin-top: 18px; color: #91b9eb; font-size: 11px; font-weight: 700; letter-spacing: .16em; }
      footer { margin-top: 28px; color: #66788f; font-size: 11px; letter-spacing: .12em; }
      @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } a { min-height: 150px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">PROJECT CASSANDRA / APPLICATION SELECTOR</p>
      <h1>CASSANDRA</h1>
      <p class="subtitle">Choose which application to open.</p>
      <nav class="choices" aria-label="Application selector">
        <a href="./game.html">
          <span class="symbol" aria-hidden="true">◈</span>
          <span><strong>GAME</strong><small>Cassandra game application and its own save format.</small></span>
          <span class="open">OPEN GAME →</span>
        </a>
        <a href="./dev-lab.html">
          <span class="symbol" aria-hidden="true">⌘</span>
          <span><strong>DEV LAB</strong><small>Standalone Engine development and testing environment.</small></span>
          <span class="open">OPEN DEV LAB →</span>
        </a>
      </nav>
      <footer>ONE PAGES SITE · TWO INDEPENDENT APPLICATION ENTRY POINTS</footer>
    </main>
  </body>
</html>
