name: Deploy development preview

on:
  push:
    branches: [next-step/phase-2]
    paths:
      - "index.html"
      - "src/adapters/presentation/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
