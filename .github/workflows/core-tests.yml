name: Core and host tests

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:all
      - name: Check browser entry-point syntax
        run: |
          node --check application-entry.js
          node --check cassandra/application/dev-lab-gameplay-controller.js
          node --check cassandra/application/dev-lab-unit-inspector-ui.js
          node --check dev-lab/application/application-shell.js
          node --check dev-lab/application/create-dev-lab-runtime.js
          node --check engine/runtime/create-game-runtime.js
          node --check engine/input/input-system.js
          node --check dev-lab/presentation/dev-world-preview.js
          node --check dev-lab/input/viewport-input-controller.js
